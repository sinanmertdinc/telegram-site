
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beşiktaş Taraftar Anketi</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    min-height: 100vh;
    padding: 30px 15px;
}
.container {
    max-width: 600px;
    margin: auto;
    background: #fff;
    color: #111;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px #0008;
}
.header {
    background: #050505;
    color: white;
    text-align: center;
    padding: 30px 20px;
    border-bottom: 5px solid #d71920;
}
.eagle { font-size: 45px; }
.header h1 { margin: 10px 0; }
.header p { color: #ccc; margin-bottom: 0; }
form { padding: 25px; }
.question { margin-bottom: 24px; }
label, .question-title {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}
input, select, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}
textarea { resize: vertical; }
.radio-option {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
    font-weight: normal;
}
.radio-option input { width: auto; }
button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #050505;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}
button:hover { background: #d71920; }
button:disabled { opacity: .6; cursor: wait; }
#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}
.footer {
    text-align: center;
    padding: 15px;
    color: #777;
    font-size: 12px;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="eagle">🦅</div>
        <h1>BEŞİKTAŞ TARAFTAR ANKETİ</h1>
        <p>Senin gözünden Beşiktaş!</p>
    </div>

    <form id="surveyForm">
        <div class="question">
            <label for="name">1. Adın ve soyadın</label>
            <input id="name" name="name" type="text" maxlength="80" required>
        </div>

        <div class="question">
            <label for="player">2. En sevdiğin Beşiktaş futbolcusu kim?</label>
            <input id="player" name="player" type="text" maxlength="80" required>
        </div>

        <div class="question">
            <span class="question-title">3. Sence Beşiktaş'ın en büyük özelliği nedir?</span>
            <label class="radio-option">
                <input type="radio" name="quality" value="Taraftar gücü" required>
                Taraftar gücü
            </label>
            <label class="radio-option">
                <input type="radio" name="quality" value="Tarihi ve gelenekleri">
                Tarihi ve gelenekleri
            </label>
            <label class="radio-option">
                <input type="radio" name="quality" value="Mücadele ruhu">
                Mücadele ruhu
            </label>
            <label class="radio-option">
                <input type="radio" name="quality" value="Hepsi">
                Hepsi
            </label>
        </div>

        <div class="question">
            <label for="years">4. Kaç yıldır Beşiktaş taraftarısın?</label>
            <select id="years" name="years" required>
                <option value="">Seçimini yap</option>
                <option>1 yıldan az</option>
                <option>1-5 yıl</option>
                <option>5-10 yıl</option>
                <option>10-20 yıl</option>
                <option>20 yıldan fazla</option>
            </select>
        </div>

        <div class="question">
            <label for="memory">5. Beşiktaş ile ilgili unutamadığın anın nedir?</label>
            <textarea id="memory" name="memory" rows="4" maxlength="500" required></textarea>
        </div>

        <button id="submitButton" type="submit">ANKETİ GÖNDER</button>
        <div id="message" role="status"></div>
    </form>

    <div class="footer">
        Gönderdiğin yanıtlar anket yöneticisine Telegram üzerinden iletilir.
    </div>
</div>

<script>
const form = document.getElementById("surveyForm");
const button = document.getElementById("submitButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    button.disabled = true;
    button.textContent = "Gönderiliyor...";
    message.textContent = "";

    const data = Object.fromEntries(new FormData(form).entries());

    try {
        const response = await fetch("/api/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Gönderim başarısız.");
        }

        message.textContent = "Anketin başarıyla gönderildi! 🦅";
        message.style.color = "green";
        form.reset();
    } catch (error) {
        message.textContent = error.message || "Bir hata oluştu.";
        message.style.color = "red";
    } finally {
        button.disabled = false;
        button.textContent = "ANKETİ GÖNDER";
    }
});
</script>
</body>
</html>
